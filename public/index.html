<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1016" />
    <meta name="description" content="Suivi de lectures : progression, sessions, objectifs annuels." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lectures" />
    <title>Mes lectures · suivi de progression</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <span class="logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 6.6C10.4 5.2 8.2 4.5 5.4 4.5H3.5v13.8h1.9c2.8 0 5 .7 6.6 2.1 1.6-1.4 3.8-2.1 6.6-2.1h1.9V4.5h-1.9c-2.8 0-5 .7-6.6 2.1Z" />
                <path d="M12 6.6v13.8" />
              </svg>
            </span>
            <div class="grow">
              <h1 id="brandTitle">Mes lectures</h1>
              <p class="sub" id="brandSub">Chargement…</p>
            </div>
          </div>
          <button class="goal-chip" data-action="nav" data-view="stats" aria-label="Voir l'objectif annuel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <circle cx="12" cy="12" r="8.5" />
              <circle cx="12" cy="12" r="4.4" />
              <circle cx="12" cy="12" r="0.6" fill="currentColor" />
            </svg>
            <span id="goalChipText">—</span>
          </button>
        </div>
      </header>

      <main id="view" class="view">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </main>

      <nav class="nav" aria-label="Navigation principale">
        <div class="nav-inner">
          <button data-action="nav" data-view="reading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-book" /></svg>
            <span>En cours</span>
          </button>
          <button data-action="nav" data-view="library">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-grid" /></svg>
            <span>Livres</span>
          </button>
          <button data-action="nav" data-view="discover">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-compass" /></svg>
            <span>Découvrir</span>
          </button>
          <button data-action="nav" data-view="stats">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chart" /></svg>
            <span>Stats</span>
          </button>
          <button data-action="nav" data-view="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-gear" /></svg>
            <span>Réglages</span>
          </button>
        </div>
      </nav>

      <button class="fab" data-action="add" aria-label="Ajouter un livre">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><use href="#i-plus" /></svg>
      </button>
    </div>

    <div id="sheetRoot"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffb454" />
          <stop offset="100%" stop-color="#ff8f3f" />
        </linearGradient>
      </defs>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path d="M12 6.6C10.4 5.2 8.2 4.5 5.4 4.5H3.5v13.8h1.9c2.8 0 5 .7 6.6 2.1 1.6-1.4 3.8-2.1 6.6-2.1h1.9V4.5h-1.9c-2.8 0-5 .7-6.6 2.1Z" />
        <path d="M12 6.6v13.8" />
      </symbol>
      <symbol id="i-grid" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="7.3" height="7.3" rx="1.7" />
        <rect x="13.2" y="3.5" width="7.3" height="7.3" rx="1.7" />
        <rect x="3.5" y="13.2" width="7.3" height="7.3" rx="1.7" />
        <rect x="13.2" y="13.2" width="7.3" height="7.3" rx="1.7" />
      </symbol>
      <symbol id="i-chart" viewBox="0 0 24 24">
        <path d="M4 20v-8" />
        <path d="M10 20V5" />
        <path d="M16 20v-5.5" />
        <path d="M2.5 20.5h19" />
      </symbol>
      <symbol id="i-gear" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.1" />
        <path d="M19.1 14.6a1.6 1.6 0 0 0 .3 1.8l.1.1a1.9 1.9 0 1 1-2.7 2.7l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a1.9 1.9 0 1 1-3.8 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a1.9 1.9 0 1 1-2.7-2.7l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a1.9 1.9 0 1 1 0-3.8h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a1.9 1.9 0 1 1 2.7-2.7l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5V3a1.9 1.9 0 1 1 3.8 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a1.9 1.9 0 1 1 2.7 2.7l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1h.2a1.9 1.9 0 1 1 0 3.8h-.1a1.6 1.6 0 0 0-1.5 1Z" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14" />
        <path d="M5 12h14" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M6 6l12 12" />
        <path d="M18 6 6 18" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.6" />
        <path d="m15.8 15.8 4.4 4.4" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16" />
        <path d="M9.4 7V5.3A1.3 1.3 0 0 1 10.7 4h2.6a1.3 1.3 0 0 1 1.3 1.3V7" />
        <path d="M6.6 7l.7 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.7-12" />
      </symbol>
      <symbol id="i-star" viewBox="0 0 24 24">
        <path d="m12 3.7 2.6 5.3 5.8.9-4.2 4.1 1 5.8L12 17.1l-5.2 2.7 1-5.8L3.6 9.9l5.8-.9Z" />
      </symbol>
      <symbol id="i-flame" viewBox="0 0 24 24">
        <path d="M12 21c3.9 0 6.3-2.6 6.3-6 0-4.4-4.3-6.2-3.9-11-2.6 1.3-4 4-4 6.2 0 .9-.5 1.5-1.2 1.5-.9 0-1.4-.9-1.4-2.3C6.4 11 5.7 13 5.7 15c0 3.4 2.4 6 6.3 6Z" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M12 7.6V12l3 1.8" />
      </symbol>
      <symbol id="i-target" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <circle cx="12" cy="12" r="4.4" />
        <circle cx="12" cy="12" r="0.6" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m4.8 12.6 4.8 4.8L19.4 6.6" />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="m9.5 5.5 6.5 6.5-6.5 6.5" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 3.6v11" />
        <path d="m7.6 10.4 4.4 4.4 4.4-4.4" />
        <path d="M4.6 20h14.8" />
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M12 20.4v-11" />
        <path d="m7.6 13.6 4.4-4.4 4.4 4.4" />
        <path d="M4.6 4h14.8" />
      </symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24">
        <path d="M6.5 3.6h11a1 1 0 0 1 1 1v15.8l-6.5-4.2-6.5 4.2V4.6a1 1 0 0 1 1-1Z" />
      </symbol>
      <symbol id="i-compass" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.6" />
        <path d="m15.3 8.7-2 4.6-4.6 2 2-4.6Z" />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.4-5.7" />
        <path d="M20 4.4V10h-5.5" />
      </symbol>
      <symbol id="i-sparkles" viewBox="0 0 24 24">
        <path d="M11.5 3.8 13.2 8.6 18 10.3l-4.8 1.7-1.7 4.8-1.7-4.8L5 10.3l4.8-1.7Z" />
        <path d="M18.4 15.4l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7Z" />
      </symbol>
    </svg>

    <script type="module" src="/app.js"></script>
  </body>
</html>
